<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RAF Galeria">
  <title>Zainstaluj RAF.studio Galeria</title>

  <script>
    window.__rafPwaInstallPrompt = null;
    window.__rafPwaInstallPromptSeen = false;
    window.addEventListener('beforeinstallprompt', function(event){
      event.preventDefault();
      window.__rafPwaInstallPrompt = event;
      window.__rafPwaInstallPromptSeen = true;
      window.dispatchEvent(new Event('raf-pwa-install-ready'));
    });
  </script>

  <link rel="manifest" href="/manifest.webmanifest?v=20.3">
  <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png?v=20.3">
  <link rel="apple-touch-icon" href="/app-icon-192.png?v=20.3">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090a;color:#f5f5f2;font-family:Inter,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#202024 0,#0d0d0f 38%,#09090a 72%)}
    .card{width:min(92vw,520px);padding:28px;border:1px solid #2d2d32;border-radius:26px;background:#121214;box-shadow:0 24px 80px #0008;text-align:center}
    .icon{width:116px;height:116px;margin:0 auto 18px;display:block;border-radius:28px}
    h1{font-size:31px;line-height:1.05;margin:0 0 12px}p{color:#a4a4aa;line-height:1.5;margin:0 0 22px}
    button,a{width:100%;min-height:52px;border-radius:15px;border:1px solid #36363b;font-weight:800;font-size:16px;cursor:pointer}
    button:disabled{opacity:.65;cursor:default}
    #installBtn{background:#f5f5f2;color:#09090a;border-color:#f5f5f2}.secondary{display:flex;align-items:center;justify-content:center;margin-top:10px;background:#19191c;color:#fff;text-decoration:none}
    #status{margin-top:18px;padding:12px;border-radius:12px;background:#0e0e10;color:#b7b7bd;font-size:13px;line-height:1.45}
    .ok{color:#aaf0bb!important;border:1px solid #2f5b3b}.warn{color:#ffd9a0!important;border:1px solid #685027}.working{color:#d9e7ff!important;border:1px solid #304963}
    #diag{margin-top:10px;color:#74747b;font-size:11px;line-height:1.35;word-break:break-word}
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/app-icon-512.png?v=20.3" alt="RAF.studio Galeria">
    <h1>RAF.studio Galeria</h1>
    <p>Zainstaluj panel fotografa jako osobną aplikację. Po instalacji uruchomi się bez paska adresu i będzie widoczny jak normalna aplikacja.</p>
    <button id="installBtn" type="button">Przygotowuję instalację…</button>
    <a class="secondary" href="/admin.html">Otwórz panel bez instalacji</a>
    <div id="status">Sprawdzam możliwość instalacji PWA…</div>
    <div id="diag"></div>
  </main>

<script>
(() => {
  const VERSION = '20.3';
  const btn = document.getElementById('installBtn');
  const status = document.getElementById('status');
  const diag = document.getElementById('diag');
  const ua = navigator.userAgent || '';
  const isSamsungInternet = /SamsungBrowser\//i.test(ua);
  const isChrome = /Chrome\//i.test(ua) && !isSamsungInternet;
  const browserName = isSamsungInternet ? 'Samsung Internet' : (isChrome ? 'Chrome' : 'przeglądarka');
  const reloadKey = 'raf-pwa-sw-bootstrap-' + VERSION;
  let deferred = window.__rafPwaInstallPrompt || null;
  let registration = null;

  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const setStatus = (text, cls='') => { status.textContent = text; status.className = cls; };
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

  function updateDiag(extra='') {
    const controlled = !!navigator.serviceWorker?.controller;
    diag.textContent = `${browserName} • HTTPS ${location.protocol === 'https:' ? 'OK' : 'NIE'} • SW ${controlled ? 'aktywny' : 'oczekuje'} • manifest PNG 192/512 • v${VERSION}${extra ? ' • ' + extra : ''}`;
  }

  function syncInstallPrompt(){
    if (window.__rafPwaInstallPrompt) deferred = window.__rafPwaInstallPrompt;
    if (!deferred || standalone()) return false;
    btn.disabled = false;
    btn.textContent = '📲 Zainstaluj aplikację';
    setStatus('Gotowe ✅ Kliknij „Zainstaluj aplikację”.', 'ok');
    updateDiag('install prompt gotowy');
    return true;
  }

  window.addEventListener('raf-pwa-install-ready', syncInstallPrompt);

  async function registerSW(){
    if (!('serviceWorker' in navigator)) throw new Error('Ta przeglądarka nie obsługuje Service Worker.');

    registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js', {scope:'/'});
    try { await registration.update(); } catch (_) {}
    await navigator.serviceWorker.ready;

    if (!navigator.serviceWorker.controller && !sessionStorage.getItem(reloadKey)) {
      sessionStorage.setItem(reloadKey, '1');
      setStatus('Aktywuję moduł aplikacji… strona odświeży się jeden raz.', 'working');
      updateDiag('pierwsza aktywacja SW');
      setTimeout(() => location.reload(), 350);
      return null;
    }

    if (navigator.serviceWorker.controller) sessionStorage.removeItem(reloadKey);
    updateDiag();
    return registration;
  }

  async function refreshInstallability(){
    try {
      if (registration) await registration.update();
    } catch (_) {}
    syncInstallPrompt();
  }

  window.addEventListener('appinstalled', () => {
    deferred = null;
    window.__rafPwaInstallPrompt = null;
    btn.textContent = '✓ Aplikacja zainstalowana';
    btn.disabled = true;
    setStatus('Gotowe. RAF.studio Galeria jest teraz osobną aplikacją na telefonie.', 'ok');
    updateDiag('zainstalowana');
    setTimeout(() => location.replace('/admin.html?source=pwa'), 900);
  });

  btn.addEventListener('click', async () => {
    if (standalone()) {
      location.replace('/admin.html?source=pwa');
      return;
    }

    await refreshInstallability();

    if (!deferred) {
      btn.disabled = true;
      btn.textContent = '⏳ Sprawdzam instalator…';
      setStatus('Chrome jeszcze ocenia instalowalność. Poczekaj chwilę — gdy będzie gotowe, przycisk sam zmieni się z powrotem na „Zainstaluj aplikację”.', 'working');

      for (let i = 0; i < 12; i++) {
        await sleep(1000);
        if (syncInstallPrompt()) return;
        updateDiag(`oczekiwanie ${i + 1}/12 s`);
      }

      btn.disabled = false;
      btn.textContent = '↻ Sprawdź ponownie';
      if (isChrome) {
        setStatus('Chrome nadal nie udostępnił instalatora. Najczęstsza przyczyna to zapamiętana wcześniejsza wersja/skrócona instalacja. Zamknij wszystkie karty galeria.raf-studio.pl, uruchom Chrome ponownie i wejdź ponownie na tę stronę. Nie używaj „Dodaj skrót” — czekamy na właściwy instalator aplikacji.', 'warn');
      } else if (isSamsungInternet) {
        setStatus('Samsung Internet nie udostępnił instalatora stronie. Spróbuj otworzyć ten sam adres w Google Chrome — manifest i Service Worker są przygotowane pod pełną PWA.', 'warn');
      } else {
        setStatus('Ta przeglądarka nie udostępniła stronie systemowego instalatora PWA. Otwórz ten adres w Google Chrome na Androidzie.', 'warn');
      }
      return;
    }

    btn.disabled = true;
    const prompt = deferred;
    deferred = null;
    window.__rafPwaInstallPrompt = null;

    try {
      const result = await prompt.prompt();
      const choice = result?.outcome ? result : await prompt.userChoice;
      if (choice?.outcome !== 'accepted') {
        btn.disabled = false;
        btn.textContent = '📲 Zainstaluj aplikację';
        setStatus('Instalacja została anulowana. Możesz uruchomić ją ponownie.', 'warn');
      }
    } catch (error) {
      btn.disabled = false;
      btn.textContent = '📲 Zainstaluj aplikację';
      setStatus('Nie udało się otworzyć systemowego instalatora: ' + (error?.message || error), 'warn');
    }
  });

  navigator.serviceWorker?.addEventListener('controllerchange', () => {
    sessionStorage.removeItem(reloadKey);
    updateDiag('nowy SW aktywny');
    setTimeout(syncInstallPrompt, 250);
  });

  (async () => {
    if (standalone()) {
      btn.textContent = 'Otwórz aplikację';
      btn.disabled = false;
      setStatus('RAF.studio Galeria jest już uruchomiona w trybie aplikacji.', 'ok');
      updateDiag('standalone');
      return;
    }

    syncInstallPrompt();

    try {
      const reg = await registerSW();
      if (!reg) return;

      if (syncInstallPrompt()) return;

      btn.disabled = false;
      btn.textContent = '📲 Zainstaluj aplikację';
      setStatus('PWA jest przygotowana. Jeśli przycisk nie otworzy okna od razu, kliknij go — strona ponownie sprawdzi instalator.', 'working');

      for (let i = 0; i < 8; i++) {
        await sleep(500);
        if (syncInstallPrompt()) return;
      }

      updateDiag('oczekuję na beforeinstallprompt');
    } catch (error) {
      btn.disabled = false;
      btn.textContent = 'Spróbuj ponownie';
      setStatus('Nie udało się przygotować PWA: ' + (error.message || error), 'warn');
      updateDiag('błąd SW');
    }
  })();
})();
</script>
</body>
</html>
