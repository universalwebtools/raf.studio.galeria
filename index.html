<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>RAF.studio — Galeria klienta</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <section id="lockScreen" class="lock-screen">
    <div class="lock-card">
      <div class="brand">RAF<span>.studio</span></div>
      <p class="eyebrow">PRYWATNA GALERIA KLIENTA</p>
      <h1 id="lockTitle">Galeria klienta</h1>
      <p id="lockSubtitle" class="muted">Wpisz hasło otrzymane od fotografa.</p>
      <form id="passwordForm">
        <input id="passwordInput" type="password" placeholder="Hasło" autocomplete="current-password" required>
        <button type="submit">Otwórz galerię</button>
        <p id="passwordError" class="error" hidden>Nieprawidłowe hasło.</p>
      </form>
      <p id="galleryNotFound" class="error" hidden>Galeria nie istnieje lub została wyłączona.</p>
    </div>
  </section>

  <main id="galleryView" hidden>
    <header class="topbar">
      <div>
        <div class="brand small">RAF<span>.studio</span></div>
        <div id="galleryName" class="gallery-name"></div>
      </div>
      <div class="header-actions">
        <button id="favoritesToggle" class="ghost">♡ Ulubione <span id="favCount">0</span></button>
        <button id="logoutBtn" class="ghost">Wyjdź</button>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">GALERIA KLIENTA</p>
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
    </section>

    <section class="toolbar">
      <div><strong id="photoCount">0</strong> zdjęć</div>
      <div>Wybrano: <strong id="selectedCount">0</strong><span id="maxFavoritesLabel"></span></div>
    </section>

    <div id="loading" class="status">Ładowanie galerii…</div>
    <div id="storageError" class="status error-box" hidden></div>
    <section id="grid" class="grid"></section>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="closeLightbox" class="lb-close">×</button>
    <button id="prevPhoto" class="lb-nav lb-prev">‹</button>
    <figure>
      <img id="lightboxImage" alt="">
      <figcaption>
        <span id="lightboxCaption"></span>
        <div class="lb-actions">
          <button id="lightboxFav" class="ghost">♡ Ulubione</button>
          <a id="lightboxDownload" class="button-link" target="_blank" rel="noopener">Pobierz oryginał</a>
        </div>
      </figcaption>
    </figure>
    <button id="nextPhoto" class="lb-nav lb-next">›</button>
  </div>

  <script type="module" src="app.js?v=4"></script>
</body>
</html>
