<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>RAF.studio — Galeria klienta</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="lockScreen" class="lock-screen">
      <div class="lock-card">
        <div class="brand">RAF<span>.studio</span></div>
        <p class="eyebrow">PRYWATNA GALERIA KLIENTA</p>
        <h1 id="lockTitle">Twoja sesja</h1>
        <p class="muted">Wpisz hasło otrzymane od fotografa.</p>
        <form id="passwordForm">
          <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Hasło" required />
          <button type="submit">Otwórz galerię</button>
          <p id="passwordError" class="error" hidden>Nieprawidłowe hasło.</p>
        </form>
      </div>
    </section>

    <main id="galleryView" hidden>
      <header class="topbar">
        <div>
          <div class="brand small">RAF<span>.studio</span></div>
          <div id="galleryName" class="gallery-name">Sesja</div>
        </div>
        <div class="header-actions">
          <button id="favoritesToggle" class="ghost">♡ Ulubione <span id="favCount">0</span></button>
          <button id="logoutBtn" class="ghost">Wyloguj</button>
        </div>
      </header>

      <section class="hero">
        <p class="eyebrow">GALERIA KLIENTA</p>
        <h1 id="heroTitle">Twoja sesja</h1>
        <p id="heroSubtitle">Wybierz ulubione zdjęcia lub pobierz wybrane fotografie.</p>
      </section>

      <section class="toolbar">
        <div><strong id="photoCount">0</strong> zdjęć</div>
        <div id="selectionInfo">Wybrano: <strong id="selectedCount">0</strong></div>
      </section>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>

    <div id="lightbox" class="lightbox" hidden>
      <button id="closeLightbox" class="lb-close" aria-label="Zamknij">×</button>
      <button id="prevPhoto" class="lb-nav lb-prev" aria-label="Poprzednie">‹</button>
      <figure>
        <img id="lightboxImage" alt="" />
        <figcaption>
          <span id="lightboxCaption"></span>
          <div class="lb-actions">
            <button id="lightboxFav" class="ghost">♡ Ulubione</button>
            <a id="lightboxDownload" class="button-link" download>Pobierz</a>
          </div>
        </figcaption>
      </figure>
      <button id="nextPhoto" class="lb-nav lb-next" aria-label="Następne">›</button>
    </div>
  </div>

  <script src="gallery-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
