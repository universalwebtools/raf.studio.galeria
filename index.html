<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <title>RAF.studio — Galeria klienta</title>
  <link rel="stylesheet" href="style.css?v=11.1">
</head>
<body class="client-body">

<section id="lockScreen" class="lock-screen">
  <div class="lock-card">
    <img class="raf-logo login-logo" src="logo-white.png?v=11.1" alt="RAF.studio">
    <p class="eyebrow">PRYWATNA GALERIA</p>
    <h1 id="lockTitle">Galeria klienta</h1>
    <p class="muted">Wpisz hasło otrzymane od fotografa.</p>

    <form id="passwordForm">
      <input id="passwordInput" type="password" placeholder="Hasło do galerii" autocomplete="current-password" required>
      <button class="primary" type="submit">Otwórz galerię</button>
      <p id="passwordError" class="error" hidden>Nieprawidłowe hasło.</p>
    </form>

    <p id="galleryNotFound" class="error" hidden></p>
  </div>
</section>

<main id="galleryView" hidden>
  <header class="client-topbar">
    <img class="raf-logo top-logo" src="logo-white.png?v=11.1" alt="RAF.studio">
    <div class="top-actions">
      <button id="favoritesToggle" type="button" class="ghost">♥ Wybrane <span id="favCount">0</span></button>
      <button id="shareBtn" type="button" class="ghost">Udostępnij</button>
      <button id="logoutBtn" type="button" class="ghost">Wyjdź</button>
    </div>
  </header>

  <section id="hero" class="client-hero">
    <div class="hero-shade"></div>
    <div class="hero-content">
      <p class="eyebrow">RAF.STUDIO • GALERIA KLIENTA</p>
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
      <div class="hero-meta">
        <span id="photoCountHero">0 zdjęć</span>
        <span id="expiryLabel"></span>
      </div>
    </div>
  </section>

  <section class="client-controls">
    <div class="segments">
      <button id="allFilter" type="button" class="seg active">Wszystkie</button>
      <button id="favFilter" type="button" class="seg">Wybrane</button>
    </div>
    <div class="selection-count">Wybrano <strong id="selectedCount">0</strong><span id="maxFavoritesLabel"></span></div>
  </section>

  <div id="progressWrap" class="select-progress" hidden>
    <div class="progress-track"><div id="selectProgress" class="progress-bar"></div></div>
    <small id="progressText"></small>
  </div>

  <div id="loading" class="loading"><span class="spinner"></span>Ładowanie galerii…</div>
  <div id="storageError" class="notice error-box" hidden></div>

  <section id="grid" class="photo-grid"></section>

  <footer class="client-footer">
    <img class="raf-logo footer-logo" src="logo-white.png?v=11.1" alt="RAF.studio">
  </footer>
</main>

<div id="lightbox" class="lightbox" hidden>
  <div class="lightbox-top">
    <span id="lightboxCaption"></span>
    <div class="lightbox-actions">
      <button id="lightboxFav" type="button" class="lb-btn" aria-label="Ulubione">♡</button>
      <a id="lightboxDownload" class="lb-btn" target="_blank" rel="noopener" aria-label="Pobierz">↓</a>
      <button id="closeLightbox" type="button" class="lb-btn" aria-label="Zamknij">×</button>
    </div>
  </div>

  <button id="prevPhoto" type="button" class="lb-arrow lb-left">‹</button>
  <div class="lightbox-stage"><img id="lightboxImage" alt=""></div>
  <button id="nextPhoto" type="button" class="lb-arrow lb-right">›</button>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js?v=11.1"></script>
</body>
</html>
