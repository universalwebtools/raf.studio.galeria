<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0a0b"><title>RAF.studio — Galeria klienta</title><link rel="stylesheet" href="style.css?v=10.3"></head>
<body class="client-body">
<section id="lockScreen" class="lock-screen"><div class="lock-card"><img class="raf-logo" src="logo-white.png?v=10.3" alt="RAF.studio"><p class="eyebrow">PRYWATNA GALERIA</p><h1 id="lockTitle">Galeria klienta</h1><p class="muted">Wpisz hasło otrzymane od fotografa.</p><form id="passwordForm"><input id="passwordInput" type="password" placeholder="Hasło do galerii" required><button class="primary" type="submit">Otwórz galerię</button><p id="passwordError" class="error" hidden>Nieprawidłowe hasło.</p></form><p id="galleryNotFound" class="error" hidden></p></div></section>
<main id="galleryView" hidden>
<header class="client-topbar"><img class="raf-logo raf-logo-small" src="logo-white.png?v=10.3" alt="RAF.studio"><div class="row"><button id="favoritesToggle" class="ghost">♡ Wybrane <span id="favCount">0</span></button><button id="shareBtn" class="ghost">Udostępnij</button><button id="logoutBtn" class="ghost">Wyjdź</button></div></header>
<section id="hero" class="client-hero"><div class="shade"></div><div class="hero-content"><p class="eyebrow">RAF.STUDIO • GALERIA KLIENTA</p><h1 id="heroTitle"></h1><p id="heroSubtitle"></p><div class="meta"><span id="photoCountHero">0 zdjęć</span><span id="expiryLabel"></span></div></div></section>
<section class="client-controls"><div class="segments"><button id="allFilter" class="seg active">Wszystkie</button><button id="favFilter" class="seg">Wybrane</button></div><div>Wybrano <strong id="selectedCount">0</strong><span id="maxFavoritesLabel"></span></div></section>
<div id="progressWrap" class="select-progress" hidden><div class="progress-track"><div id="selectProgress" class="progress-bar"></div></div><small id="progressText"></small></div>
<div id="loading" class="loading"><span class="spinner"></span>Ładowanie zdjęć…</div><div id="storageError" class="notice error" hidden></div>
<section id="grid" class="photo-grid"></section>
<button id="prevPhoto" class="arrow left">‹</button><div class="stage"><img id="lightboxImage"></div><button id="nextPhoto" class="arrow right">›</button></div>


<div id="toast" class="toast" hidden></div><script type="module" src="app.js?v=10.3"></script></body></html>
