name: RAF v16.3.0 final validation

on:
  push:
    branches:
      - v16.3.0-final
    paths:
      - '.github/workflows/raf-v1630-final.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v16.3.0-final

      - name: Finalize v16.3.0 labels and cache
        run: python3 scripts/finalize_v1630.py

      - name: Validate stable integrated rejected-photo workflow
        run: |
          node --check app.js
          node --check admin.js
          grep -q 'normalizedSharedRejected' app.js
          grep -q 'toggleRejected' app.js
          grep -q 'renderRejectedAdminTools' admin.js
          grep -q 'download-remaining' admin.js
          grep -q '>Odrzucone</button>' index.html
          grep -q 'uiLabelHidden" value="Odrzucone"' admin.html
          ! grep -q 'reject-addon.js' firebase-config.js
          git diff --check

      - name: Commit validated v16.3.0 and remove temporary files
        run: |
          rm -f .github/workflows/raf-v1630-final.yml
          rm -f scripts/finalize_v1630.py
          git config user.name 'RAF.studio updater'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js admin.js index.html admin.html .github/workflows/raf-v1630-final.yml scripts/finalize_v1630.py
          git commit -m 'RAF v16.3.0 rejected photos final'
          git push origin v16.3.0-final
