name: RAF v16.4 client zone installer

on:
  push:
    paths:
      - '.github/workflows/raf-v16.4-client-zone.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v16.4 patch
        run: python tools/v164_patch.py

      - name: Commit update
        run: |
          git config user.name "RAF.studio updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add RAF.studio client gallery directory v16.4"
          git push
