name: Patch admin PUSH module

on:
  push:
    paths:
      - '.github/workflows/patch-admin-push.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject PUSH module into admin.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script type="module" src="admin-push-v20.3.js?v=20.3"></script>\n'
          if 'admin-push-v20.3.js' not in s:
              s = s.replace('</body>', tag + '</body>')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Nothing to patch"
            exit 0
          fi
          git config user.name "RAF.studio bot"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git commit -m "Load admin push module v20.3"
          git push
