name: RAF v16.3.0 rejected-photo stage

on:
  push:
    branches:
      - v16.3.0-rejected
    paths:
      - '.github/workflows/raf-v1630-stage.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v16.3.0-rejected

      - name: Apply tested v16.3.0 patch
        run: python3 scripts/raf_v1630_rejected.py

      - name: Validate JavaScript and generated markers
        run: |
          node --check app.js
          node --check admin.js
          grep -q 'Odrzucone' index.html
          grep -q 'Pobierz nieodrzucone' admin.js
          grep -q 'v16.3.0: SHARED REJECTED PHOTOS' style.css
          git diff --check

      - name: Commit staged update and remove temporary files
        run: |
          rm -f .github/workflows/raf-v1630-stage.yml
          rm -f scripts/raf_v1630_rejected.py
          git config user.name 'RAF.studio updater'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js admin.js index.html admin.html style.css .github/workflows/raf-v1630-stage.yml scripts/raf_v1630_rejected.py
          git commit -m 'RAF v16.3.0 rejected photos workflow'
          git push origin v16.3.0-rejected
