name: RAF v16.6 home settings patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raf-home-settings-v16.6.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add home settings module to admin
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          script = '  <script type="module" src="admin-home-settings-v16.6.js?v=16.6"></script>\n'
          if script not in text:
              text = text.replace('</body>', script + '</body>')
              p.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          if git diff --quiet -- admin.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Enable client zone settings in admin v16.6"
          git push
