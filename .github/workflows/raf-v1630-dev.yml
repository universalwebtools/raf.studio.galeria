name: RAF v16.3.0 rejected-photo safe updater

on:
  push:
    branches:
      - v16.3.0-rejected-dev
    paths:
      - '.github/workflows/raf-v1630-dev.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v16.3.0-rejected-dev
          fetch-depth: 0

      - name: Apply v16.3.0 patch
        run: python3 scripts/apply_v163.py

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check admin.js

      - name: Commit tested v16.3.0
        run: |
          rm -f .github/workflows/raf-v1630-dev.yml
          rm -f scripts/apply_v163.py
          git config user.name "RAF.studio updater"
          git config user.email "actions@users.noreply.github.com"
          git add app.js admin.js index.html admin.html .github/workflows/raf-v1630-dev.yml scripts/apply_v163.py
          git commit -m "RAF v16.3.0 rejected photos"
          git push origin HEAD:v16.3.0-rejected-dev
