name: RAF v16.2.5 one-time updater

on:
  push:
    paths:
      - '.github/workflows/raf-v1625-updater.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v16.2.5 patch
        run: python3 scripts/raf_v1625_update.py

      - name: Validate JavaScript
        run: |
          node --check admin.js
          node --check app.js

      - name: Commit final update and remove temporary updater
        run: |
          rm -f .github/workflows/raf-v1625-updater.yml
          rm -f scripts/raf_v1625_update.py
          git config user.name "RAF.studio updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin.html admin.js app.js style.css .github/workflows/raf-v1625-updater.yml scripts/raf_v1625_update.py
          git commit -m "Update RAF.studio gallery to v16.2.5 mobile compact UI"
          git push
